<html>
<head>

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="JMAC Training">
<style>
    :root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--muted:#6b7280;--brand:#4338ca;--brand-dark:#312e81;--line:#d1d5db;--green:#166534;--green-bg:#dcfce7;--red:#991b1b;--soft:#eef2ff;--amber:#92400e;--amber-bg:#fef3c7}

    header{position:sticky;top:0;z-index:20;background:linear-gradient(135deg,var(--brand-dark),var(--brand));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 12px}header h1{margin:0;font-size:21px}header p{margin:4px 0 0;opacity:.86;font-size:13px}
    main{width:100%;max-width:1100px;margin:auto;padding:10px}.hidden{display:none!important}.card,.toolbar{background:var(--card);border:1px solid var(--line);border-radius:12px;box-shadow:0 2px 8px #0000000d}.card{margin-bottom:12px;overflow:hidden}
    .toolbar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;padding:10px;margin-bottom:10px}label{display:block;font-size:11px;font-weight:800;color:var(--muted);margin-bottom:4px}select,input,textarea,button{width:100%;font:inherit}select,input,textarea{padding:10px;border:1px solid var(--line);border-radius:8px;background:#fff;font-size:16px}button{padding:11px;border:0;border-radius:9px;font-weight:800;cursor:pointer}.primary{background:var(--brand);color:#fff}.secondary{background:#e5e7eb;color:#111827}.share-btn{background:#0f766e;color:#fff}.danger{background:#fee2e2;color:#991b1b}
    .tabs{display:flex;overflow-x:auto;gap:6px;margin-bottom:10px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 auto;min-width:108px;background:#e5e7eb}.tab.active{background:var(--brand-dark);color:#fff}
    .section-title,.block-title{padding:10px 14px;font-weight:800}.section-title{background:var(--soft)}.block-title{background:#dbeafe}.exercise{padding:12px 14px;border-top:1px solid var(--line);transition:.2s}.exercise.completed{background:var(--green-bg)}.exercise.collapsed .exercise-body{display:none}.exercise-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.exercise h3{margin:0 0 4px;font-size:17px}.target,.previous{font-size:12px;color:var(--muted);line-height:1.4}.previous{color:#3730a3;margin-top:4px}.exercise-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}.exercise-actions button{width:auto;padding:7px 9px;font-size:12px}
    .set-grid{display:grid;grid-template-columns:46px minmax(0,1fr) minmax(0,1fr) minmax(0,.75fr) 48px;gap:6px;align-items:center;margin-top:8px;padding:5px;border-radius:8px}.set-grid.done{background:var(--green-bg)}.set-label{text-align:center;font-weight:800;font-size:12px}.complete{width:23px;height:23px}.notes{margin-top:8px}
    .progress-wrap{background:#e5e7eb;border-radius:999px;overflow:hidden;height:12px;margin:8px 0}.progress-bar{height:100%;width:0;background:#16a34a;transition:.2s}.progress-text{font-size:12px;font-weight:800;text-align:right;color:var(--muted)}
    .simple-row{display:grid;grid-template-columns:90px minmax(0,1fr) 46px;gap:8px;align-items:center;padding:10px 12px;border-top:1px solid var(--line)}.simple-row:first-of-type{border-top:0}.simple-row strong{font-size:12px}.note-card{padding:12px 14px;border-top:1px solid var(--line)}

    #status{font-weight:800;margin:7px 0;color:var(--green)}table{width:100%;border-collapse:collapse;min-width:680px}th,td{padding:8px;border-bottom:1px solid var(--line);font-size:12px;text-align:left}th{background:#f9fafb}
    .timer{position:fixed;right:10px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;background:#111827;color:#fff;border-radius:14px;padding:10px;box-shadow:0 6px 20px #0005;width:190px}.timer-row{display:flex;gap:6px;align-items:center}.timer-display{font-size:25px;font-weight:900;text-align:center;margin-bottom:6px}.timer button,.timer select{padding:7px;font-size:12px}.timer select{color:#111827}
    .modal-backdrop{position:fixed;inset:0;background:#0008;z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}.modal{background:#fff;border-radius:14px;max-width:760px;width:100%;max-height:90vh;overflow:auto;padding:14px}.modal h2{margin-top:0}.pr-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.pr{background:var(--soft);padding:10px;border-radius:8px;text-align:center}.pr b{display:block;font-size:18px}.login-card{max-width:430px;margin:50px auto;padding:18px}.login-card h2{margin-top:0}.login-error{color:var(--red);font-weight:700}.summary-good{background:var(--green-bg);padding:10px;border-radius:8px;color:var(--green)}.admin-grid{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;padding:12px}.profile-row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}.link-button{display:inline-block;background:var(--brand);color:#fff;padding:9px 12px;border-radius:8px;text-decoration:none;font-weight:800}
    @media(max-width:800px){.toolbar{grid-template-columns:1fr 1fr 1fr}.pr-grid{grid-template-columns:1fr 1fr}.admin-grid,.profile-row{grid-template-columns:1fr 1fr}.timer{width:175px}}
    @media(max-width:520px){main{padding:8px}.toolbar{grid-template-columns:1fr 1fr}.toolbar>div{min-width:0}.set-grid{grid-template-columns:40px minmax(0,1fr) minmax(0,1fr) 46px}.metric-rpe{display:none}.exercise{padding:10px}.exercise h3{font-size:16px}.timer{right:7px;bottom:7px;width:160px}.timer-display{font-size:22px}.actions button{padding:11px 6px}.profile-row{grid-template-columns:1fr}.admin-grid{grid-template-columns:1fr}}
  
    :root{
      --mobile-nav-height:64px;
      --mobile-actions-height:70px;
      --keyboard-offset:0px;
    }
    html{height:100%;background:var(--bg)}
    body{
      min-height:100dvh;
      min-height:-webkit-fill-available;
      overscroll-behavior-y:contain;
      -webkit-text-size-adjust:100%;
      touch-action:manipulation;
    }
    button,input,select,textarea{-webkit-tap-highlight-color:transparent}
    button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{
      outline:3px solid #93c5fd;
      outline-offset:2px;
    }
    .mobile-options-toggle{display:none;margin-bottom:8px}
    .timer-head{display:flex;align-items:center;justify-content:space-between;gap:8px}
    .timer-toggle{width:34px!important;min-width:34px;padding:5px!important;background:#374151;color:#fff}
    .timer.collapsed{width:78px;padding:8px}
    .timer.collapsed .timer-body{display:none}
    .timer.collapsed .timer-head{justify-content:center}
    .timer.collapsed .timer-display{font-size:18px;margin:0}
    .history-cards{display:none}
    .history-card{
      padding:11px 12px;
      border-top:1px solid var(--line);
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:8px;
    }
    .history-card:first-child{border-top:0}
    .history-card-title{font-weight:800}
    .history-card-meta{font-size:12px;color:var(--muted);margin-top:3px}
    .history-card-load{font-weight:800;text-align:right;white-space:nowrap}
    .keyboard-open .tabs,
    .keyboard-open .actions,
    .keyboard-open .timer{display:none!important}

    @media(max-width:700px){
      body{padding-bottom:calc(var(--mobile-nav-height) + env(safe-area-inset-bottom))}
      header{padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
      header h1{font-size:18px;line-height:1.15}
      header p{font-size:11px;margin-top:2px}
      main{padding:8px 8px calc(var(--mobile-nav-height) + 14px)}
      .mobile-options-toggle{display:block}
      .toolbar{
        grid-template-columns:1fr 1fr;
        padding:9px;
        max-height:500px;
        opacity:1;
        overflow:hidden;
        transition:max-height .22s ease,opacity .18s ease,padding .22s ease,border-width .22s ease;
      }
      .toolbar.mobile-collapsed{
        display:grid;
        max-height:0;
        opacity:0;
        padding-top:0;
        padding-bottom:0;
        margin-bottom:0;
        border-width:0;
      }
      .tabs{
        position:fixed;
        left:0;
        right:0;
        bottom:0;
        z-index:60;
        height:calc(var(--mobile-nav-height) + env(safe-area-inset-bottom));
        display:flex;
        align-items:stretch;
        gap:0;
        margin:0;
        padding:5px max(4px,env(safe-area-inset-left)) env(safe-area-inset-bottom) max(4px,env(safe-area-inset-right));
        background:#fff;
        border-top:1px solid var(--line);
        box-shadow:0 -4px 16px #0002;
        overflow:visible;
      }
      .tab{
        flex:1 1 0;
        min-width:0;
        padding:7px 3px;
        border-radius:8px;
        font-size:10px;
        line-height:1.1;
      }
      .actions{
        position:fixed;
        left:0;
        right:0;
        bottom:calc(var(--mobile-nav-height) + env(safe-area-inset-bottom));
        z-index:55;
        margin:0;
        padding:8px max(8px,env(safe-area-inset-left)) 8px max(8px,env(safe-area-inset-right));
        background:#fff;
        border-top:1px solid var(--line);
        box-shadow:0 -5px 16px #0002;
      }
      .actions button{font-size:11px;padding:11px 5px}
      #view-workout{padding-bottom:calc(var(--mobile-actions-height) + 8px)}
      .timer{
        right:8px;
        bottom:calc(var(--mobile-nav-height) + var(--mobile-actions-height) + env(safe-area-inset-bottom) + 10px);
        width:min(190px,calc(100vw - 16px));
      }
      body:not([data-view="workout"]) .timer{
        bottom:calc(var(--mobile-nav-height) + env(safe-area-inset-bottom) + 10px);
      }
      .exercise-head{align-items:center}
      .exercise h3{font-size:16px;line-height:1.25}
      .exercise-actions{display:grid;grid-template-columns:1fr 1fr}
      .exercise-actions button,.exercise-actions a{text-align:center}
      .set-grid{
        grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) 46px;
        gap:5px;
        padding:5px 1px;
      }
      .set-grid input{padding:10px 6px;min-width:0}
      .metric-rpe{display:none}
      .complete{width:24px;height:24px}
      .simple-row{grid-template-columns:74px minmax(0,1fr) 42px;padding:10px}
      .history-table-wrap{display:none}
      .history-cards{display:block}
      .modal-backdrop{
        align-items:flex-end;
        padding:0;
      }
      .modal{
        width:100%;
        max-width:none;
        max-height:88dvh;
        border-radius:16px 16px 0 0;
        padding:14px 14px calc(14px + env(safe-area-inset-bottom));
      }
      .login-card{margin:18px auto}
    }

    @media(max-width:390px){
      .toolbar{grid-template-columns:1fr}
      .actions button{font-size:10px}
      .tab{font-size:9px}
      .set-grid{grid-template-columns:38px minmax(0,1fr) minmax(0,1fr) 42px}
      .set-label{font-size:11px}
    }

    @media(max-width:900px) and (orientation:landscape) and (max-height:520px){
      header{position:relative;padding:6px 10px}
      header p{display:none}
      main{padding-top:5px}
      .mobile-options-toggle{display:block;padding:7px}
      .toolbar{grid-template-columns:repeat(5,minmax(0,1fr))}
      .timer{
        width:160px;
        bottom:calc(var(--mobile-nav-height) + 6px);
      }
      .actions{left:50%;right:6px;border-radius:12px 12px 0 0}
      #view-workout{padding-bottom:60px}
      .set-grid{grid-template-columns:42px minmax(0,1fr) minmax(0,1fr) minmax(0,.7fr) 44px}
      .metric-rpe{display:block}
    }

  
    .install-btn{background:#b45309;color:#fff}
    .install-banner{
      display:none;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      margin-bottom:10px;
      padding:10px 12px;
      border-radius:12px;
      background:#fff7ed;
      border:1px solid #fdba74;
      color:#7c2d12;
      box-shadow:0 2px 8px #0000000d;
    }
    .install-banner.visible{display:flex}
    .install-banner strong{display:block}
    .install-banner span{font-size:12px}
    .install-banner button{width:auto;min-width:110px}
    .install-steps{margin:0;padding-left:20px}
    .install-steps li{margin:8px 0}
    .platform-pill{
      display:inline-block;
      padding:4px 8px;
      border-radius:999px;
      background:#eef2ff;
      color:#312e81;
      font-size:12px;
      font-weight:800;
      margin-bottom:8px;
    }
    .installed-badge{
      display:none;
      padding:6px 9px;
      border-radius:999px;
      background:#dcfce7;
      color:#166534;
      font-size:12px;
      font-weight:800;
    }
    .installed-badge.visible{display:inline-block}
    @media(max-width:700px){
      .install-banner{
        position:relative;
        flex-direction:column;
        align-items:stretch;
      }
      .install-banner button{width:100%}
    }

  
    .dashboard-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      margin-bottom:12px;
    }
    .metric-card{
      background:#fff;
      border:1px solid var(--line);
      border-radius:12px;
      padding:12px;
      box-shadow:0 2px 8px #0000000d;
    }
    .metric-card span{display:block;font-size:11px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
    .metric-card b{display:block;font-size:24px;margin-top:5px}
    .metric-card small{display:block;color:var(--muted);margin-top:3px}
    .week-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;padding:12px}
    .day-chip{padding:9px 4px;border-radius:9px;text-align:center;background:#f3f4f6;font-size:11px;font-weight:800}
    .day-chip.done{background:#dcfce7;color:#166534}
    .checkin-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px;padding:12px}
    .checkin-grid .wide{grid-column:span 2}
    .chart-wrap{padding:12px;overflow:hidden}
    .chart-empty{padding:28px;text-align:center;color:var(--muted)}
    .mini-chart{width:100%;height:180px;display:block}
    .dashboard-list{padding:0 12px 12px}
    .dashboard-list-row{display:grid;grid-template-columns:100px 1fr auto;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
    .dashboard-list-row:last-child{border-bottom:0}
    .positive{color:#166534}.negative{color:#991b1b}
    @media(max-width:700px){
      .dashboard-grid{grid-template-columns:1fr 1fr}
      .metric-card b{font-size:21px}
      .week-strip{grid-template-columns:repeat(7,minmax(44px,1fr));overflow-x:auto}
      .checkin-grid{grid-template-columns:1fr 1fr}
      .checkin-grid .wide{grid-column:span 2}
      .dashboard-list-row{grid-template-columns:82px 1fr auto}
      .tabs{overflow-x:auto!important;overflow-y:hidden!important;justify-content:flex-start}
      .tab{flex:0 0 76px!important;min-width:76px!important}
    }
    @media(max-width:390px){
      .dashboard-grid{grid-template-columns:1fr 1fr}
      .checkin-grid{grid-template-columns:1fr}
      .checkin-grid .wide{grid-column:span 1}
    }

  
    .set-grid input::placeholder,
    .checkin-grid input::placeholder,
    input.metric-input::placeholder {
      color:#9ca3af;
      opacity:1;
      font-weight:600;
    }
    .set-grid input:placeholder-shown {
      background:#f3f4f6;
      color:#374151;
    }
    .set-grid input:not(:placeholder-shown) {
      background:#ffffff;
    }

  
    .set-column-head {
      display:grid;
      grid-template-columns:56px 1fr 1fr 1fr 64px;
      gap:8px;
      align-items:center;
      margin-top:10px;
      padding:0 2px;
      color:#6b7280;
      font-size:10px;
      font-weight:800;
      text-transform:uppercase;
      letter-spacing:.04em;
      text-align:center;
    }
    .set-grid .reps.auto-prescribed {
      background:#eef2ff;
      color:#312e81;
      font-weight:800;
    }
    .exercise-actions {
      grid-template-columns:repeat(3,minmax(0,1fr));
    }
    @media(max-width:700px){
      .set-column-head {
        grid-template-columns:44px 1fr 1fr 56px;
        gap:6px;
      }
      .set-column-head .rpe-head { display:none; }
      .exercise-actions {
        grid-template-columns:repeat(3,minmax(0,1fr));
      }
      .exercise-actions button {
        padding:9px 4px;
        font-size:11px;
      }
    }

  
    .set-grid input.auto-carried {
      background:#f3f4f6;
      color:#374151;
      font-weight:700;
    }
    .set-grid input.auto-carried:focus {
      background:#ffffff;
    }

  
    .load-note {
      display:inline-flex;
      align-items:center;
      gap:5px;
      margin-top:5px;
      padding:4px 7px;
      border-radius:999px;
      background:#f3f4f6;
      color:#4b5563;
      font-size:11px;
      font-weight:800;
    }
    .load-note.added-load {
      background:#eef2ff;
      color:#312e81;
    }
    .set-grid input.bodyweight-load {
      background:#eef2ff;
      color:#312e81;
      font-weight:800;
    }
    .set-grid input.no-load {
      background:#f3f4f6;
      color:#6b7280;
      font-weight:800;
      text-align:center;
    }
    .set-grid input[readonly] {
      cursor:default;
    }

  
    .preference-row {
      display:grid;
      grid-template-columns:minmax(0,1fr) auto;
      gap:12px;
      align-items:center;
      padding:12px 14px;
      border-top:1px solid var(--line);
    }
    .preference-row:first-of-type {
      border-top:0;
    }
    .preference-copy b {
      display:block;
      margin-bottom:3px;
    }
    .preference-copy span {
      display:block;
      color:var(--muted);
      font-size:12px;
      line-height:1.4;
    }
    .switch {
      position:relative;
      display:inline-block;
      width:54px;
      height:30px;
      flex:0 0 auto;
    }
    .switch input {
      width:0;
      height:0;
      opacity:0;
    }
    .switch-slider {
      position:absolute;
      inset:0;
      border-radius:999px;
      background:#d1d5db;
      cursor:pointer;
      transition:.18s ease;
    }
    .switch-slider::before {
      content:"";
      position:absolute;
      width:24px;
      height:24px;
      left:3px;
      top:3px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 2px 6px #0003;
      transition:.18s ease;
    }
    .switch input:checked + .switch-slider {
      background:#4338ca;
    }
    .switch input:checked + .switch-slider::before {
      transform:translateX(24px);
    }

  </style>
</head>
<body data-view="workout">
<header><h1 id="appTitle">JMAC Training</h1><p id="subtitle">Training log, progress and recovery</p></header>
<main>
  <section id="loginView" class="card login-card">
    <h2>Log in</h2>
    <label>Athlete profile</label><select id="loginAthlete"></select>
    <label style="margin-top:10px">PIN</label><input id="loginPin" type="password" inputmode="numeric" placeholder="4+ digit PIN">
    <button class="primary" style="margin-top:12px" onclick="loginUser()">Open Training App</button>
    <div id="loginError" class="login-error"></div>
  </section>

  <section id="appView" class="hidden">
    <button id="mobileOptionsToggle" class="mobile-options-toggle secondary" onclick="toggleMobileOptions()">Show Workout Options</button>
    <section class="toolbar">
      <div><label>Athlete</label><div id="athleteName" style="padding:10px;font-weight:900"></div></div>
      <div><label>Workout day</label><select id="day"></select></div>
      <div><label>Program week</label><select id="week"><option value="1">Week 1</option><option value="2">Week 2</option><option value="3">Week 3</option><option value="4">Week 4</option></select></div>
      <div><label>Date</label><input id="date" type="date"></div>
      <div><label>Share</label><button class="share-btn" onclick="shareApp()">Share Link</button></div>
      <div id="installControl"><label>Install</label><button id="installButton" class="install-btn" onclick="installApp()">Install App</button><span id="installedBadge" class="installed-badge">Installed</span></div>
      <div><label>Profile</label><button class="secondary" onclick="logoutUser()">Log Out</button></div>
    </section>

  
  <div id="installBanner" class="install-banner">
    <div>
      <strong>Install JMAC Training on this phone</strong>
      <span>Open it from your Home Screen like a regular app.</span>
    </div>
    <div style="display:flex;gap:6px"><button class="install-btn" onclick="installApp()">Install / Add to Home Screen</button><button class="secondary" style="width:auto" onclick="dismissInstallBanner()" aria-label="Dismiss">×</button></div>
  </div>

  <div class="tabs">
      <button class="tab active" data-view="workout" onclick="showView('workout')">Workout</button>
      <button class="tab" data-view="dashboard" onclick="showView('dashboard')">Dashboard</button>
      <button class="tab" data-view="warmup" onclick="showView('warmup')">Warm-up</button>
      <button class="tab" data-view="daily" onclick="showView('daily')">Daily Plan</button>
      <button class="tab" data-view="notes" onclick="showView('notes')">Coach Notes</button>
      <button class="tab" data-view="history" onclick="showView('history')">History</button>

    <div id="status"></div>

      <section class="card" style="padding:10px 12px"><div class="progress-text" id="progressText">0 of 0 sets complete</div><div class="progress-wrap"><div id="progressBar" class="progress-bar"></div></div></section>
      <div id="workout">Loading…</div>
      <div class="actions"><button class="secondary" onclick="addSetToAll()">+ Add Set to All</button><button class="secondary" onclick="resetSession()">Reset Session</button><button class="primary" onclick="saveWorkout()">Save Workout</button></div>
    </section>
    <section id="view-dashboard" class="hidden"></section>
    <section id="view-warmup" class="hidden"></section>
    <section id="view-daily" class="hidden"></section>

    <section id="view-history" class="hidden card"><div class="section-title">Recent workout log</div><div id="historyCards" class="history-cards"></div><div class="history-table-wrap" style="overflow:auto"><table><thead><tr><th>Date</th><th>Day</th><th>Exercise</th><th>Set</th><th>Reps</th><th>Weight</th><th>RPE</th></tr></thead><tbody id="history"></tbody></table></div></section>

</main>

<div id="timer" class="timer hidden">
  <div class="timer-head">
    <div class="timer-display" id="timerDisplay">01:30</div>
    <button id="timerToggle" class="timer-toggle" onclick="toggleTimerPanel()" aria-label="Minimize rest timer">−</button>
  </div>

  <div class="timer-row"><select id="timerPreset"><option value="60">60s</option><option value="75">75s</option><option value="90" selected>90s</option><option value="120">120s</option><option value="180">180s</option></select><button onclick="startTimer()">Start</button><button onclick="stopTimer()">Stop</button></div>
  <label style="color:#fff;margin-top:6px"><input id="autoTimer" type="checkbox" checked style="width:auto"> Auto-start after set</label>
  </div>
</div>
<div id="modalRoot"></div>

<script>
let appData=null, authToken='', sessionId='', sessionStartedAt=0, timerInterval=null, timerRemaining=0, draftTimer=null;
const $=id=>document.getElementById(id);


let deferredInstallPrompt=null;

window.addEventListener('beforeinstallprompt',event=>{
  event.preventDefault();
  deferredInstallPrompt=event;
  updateInstallUI();
});

window.addEventListener('appinstalled',()=>{
  deferredInstallPrompt=null;
  localStorage.setItem('jmac-installed','1');
  updateInstallUI(true);
  setStatus('JMAC Training was installed.');
});

function isStandalone(){
  return window.matchMedia('(display-mode: standalone)').matches ||
    window.navigator.standalone===true;
}

function getPlatform(){
  const ua=navigator.userAgent||'';
  const isIOS=/iPad|iPhone|iPod/.test(ua) ||
    (navigator.platform==='MacIntel' && navigator.maxTouchPoints>1);
  const isAndroid=/Android/.test(ua);
  return {isIOS,isAndroid};
}

function updateInstallUI(forceInstalled=false){
  const installed=forceInstalled||isStandalone()||localStorage.getItem('jmac-installed')==='1';
  const button=$('installButton');
  const badge=$('installedBadge');
  const banner=$('installBanner');

  if(button)button.classList.toggle('hidden',installed);
  if(badge)badge.classList.toggle('visible',installed);
  if(banner){
    const dismissed=sessionStorage.getItem('jmac-install-dismissed')==='1';
    banner.classList.toggle('visible',!installed&&!dismissed);
  }
}

async function installApp(){
  if(isStandalone()){
    setStatus('JMAC Training is already installed.');
    updateInstallUI(true);
    return;
  }

  if(deferredInstallPrompt){
    deferredInstallPrompt.prompt();
    const result=await deferredInstallPrompt.userChoice;
    if(result.outcome==='accepted'){
      setStatus('Installing JMAC Training…');
    }else{
      setStatus('Installation was canceled.');
    }
    deferredInstallPrompt=null;
    updateInstallUI();
    return;
  }

  showInstallInstructions();
}

function showInstallInstructions(){
  const platform=getPlatform();
  const modal=$('installModal');
  const pill=$('installPlatform');
  const instructions=$('installInstructions');

  if(platform.isIOS){
    pill.textContent='iPhone / iPad — Safari';
    instructions.innerHTML=`
      <ol class="install-steps">
        <li>Open this app link in <b>Safari</b>.</li>
        <li>Tap the <b>Share</b> button.</li>
        <li>Scroll down and tap <b>Add to Home Screen</b>.</li>
        <li>Turn on <b>Open as Web App</b>, then tap <b>Add</b>.</li>
      </ol>
      <p class="target">The JMAC icon will appear on your Home Screen and open without the normal Safari toolbar.</p>`;
  }else if(platform.isAndroid){
    pill.textContent='Android — Chrome';
    instructions.innerHTML=`
      <ol class="install-steps">
        <li>Open this app link in <b>Chrome</b>.</li>
        <li>Tap Chrome's <b>three-dot menu</b>.</li>
        <li>Tap <b>Install app</b> or <b>Add to Home screen</b>.</li>
        <li>Confirm the installation.</li>
      </ol>
      <p class="target">When Chrome provides a native install prompt, the Install App button will open it automatically.</p>`;
  }else{
    pill.textContent='Desktop / Other Browser';
    instructions.innerHTML=`
      <ol class="install-steps">
        <li>Open the browser menu.</li>
        <li>Look for <b>Install JMAC Training</b>, <b>Install app</b>, or <b>Create shortcut</b>.</li>
        <li>On a phone, open the link in Safari or Chrome for the best installation experience.</li>
      </ol>`;
  }

  modal.classList.remove('hidden');
}

function closeInstallModal(event){
  if(event && event.target && event.target.id!=='installModal')return;
  const modal=$('installModal');
  if(modal)modal.classList.add('hidden');
}

function dismissInstallBanner(){
  sessionStorage.setItem('jmac-install-dismissed','1');
  updateInstallUI();
}

document.addEventListener('DOMContentLoaded',()=>{
  $('date').value=new Date().toISOString().slice(0,10);
  google.script.run.withSuccessHandler(initLogin).withFailureHandler(showLoginError).getLoginBootstrap();
});

function initLogin(data){$('appTitle').textContent=data.title||'JMAC Training';$('loginAthlete').innerHTML=(data.profiles||[]).map(x=>`<option>${esc(x)}</option>`).join('');const saved=localStorage.getItem('jmac-athlete');if(saved)$('loginAthlete').value=saved}
function loginUser(){showLoginError('');google.script.run.withSuccessHandler(result=>{authToken=result.token;localStorage.setItem('jmac-athlete',$('loginAthlete').value);initApp(result.bootstrap)}).withFailureHandler(showLoginError).login($('loginAthlete').value,$('loginPin').value)}
function logoutUser(){if(authToken)google.script.run.logout(authToken);authToken='';appData=null;$('appView').classList.add('hidden');$('loginView').classList.remove('hidden');$('timer').classList.add('hidden');$('loginPin').value=''}
function showLoginError(e){$('loginError').textContent=typeof e==='string'?e:'Error: '+(e.message||e)}

function initApp(data){initMobileLayout();appData=data;$('loginView').classList.add('hidden');$('appView').classList.remove('hidden');$('timer').classList.remove('hidden');$('appTitle').textContent=data.title||'JMAC Training';$('athleteName').textContent=data.athlete;$('subtitle').textContent=`${data.athlete} • ${data.role} • Track, progress and recover`;const days=[...new Set(data.program.map(x=>x.Day))];$('day').innerHTML=days.map(x=>`<option>${esc(x)}</option>`).join('');$('day').value=days.includes(data.defaultDay)?data.defaultDay:days[0];$('week').value=String(data.currentWeek||1);$('day').onchange=()=>{google.script.run.setDefaultDay(authToken,$('day').value);startNewDaySession();renderAll();setTimeout(restoreDraft,30)};$('week').onchange=()=>{google.script.run.setCurrentWeek(authToken,Number($('week').value));startNewDaySession();renderWorkout();setTimeout(restoreDraft,30)};$('date').onchange=()=>{startNewDaySession();renderWorkout();setTimeout(restoreDraft,30)};if(String(data.role).toLowerCase()==='coach')$('adminTab').classList.remove('hidden');else $('adminTab').classList.add('hidden');sessionId=localStorage.getItem(sessionKey('id'))||newId();sessionStartedAt=Number(localStorage.getItem(sessionKey('started'))||Date.now());localStorage.setItem(sessionKey('id'),sessionId);localStorage.setItem(sessionKey('started'),String(sessionStartedAt));applyCoachPreferences();renderAll();renderHistory(data.history||[]);renderAdmin();setTimeout(restoreDraft,30)}
function startNewDaySession(){sessionId=newId();sessionStartedAt=Date.now();localStorage.setItem(sessionKey('id'),sessionId);localStorage.setItem(sessionKey('started'),String(sessionStartedAt))}
function renderAll(){renderWorkout();renderDashboard();renderWarmup();renderDaily();renderNotes();renderAdmin()}
function getDayRows(list){return (list||[]).filter(x=>x.Day===$('day').value).sort((a,b)=>Number(a.Order||0)-Number(b.Order||0))}
function targetFor(item){return item['Week '+$('week').value]||''}
function setCount(target){const m=String(target).match(/^(\d+)\s*[x×]/i);return m?Math.max(1,Number(m[1])):1}
function inputType(item){return item['Input Type']||'REPS_WEIGHT'}
function currentBodyweight(){const value=Number(appData&&appData.dashboard&&appData.dashboard.latestWeight||0);return value>0?value:''}
function bodyweightMode(item){
  if(inputType(item)!=='REPS_WEIGHT')return 'NORMAL';

  const exercise=String(item.Exercise||'').toUpperCase();
  const suggested=String(item['Suggested Load']||'').toUpperCase().trim();
  const isBw=/\bBW\b|BODY\s*WEIGHT|BODYWEIGHT/.test(suggested);

  if(!isBw)return 'NORMAL';

  if(/\+|WEIGHTED|ADDED/.test(suggested)||/WEIGHTED|PULL-UP|PULLUP|CHIN-UP|CHINUP|DIP|GLUTE HAM|SLIDING LEG CURL/.test(exercise)){
    return 'ADDED_LOAD';
  }

  if(/JUMP|BOUND|HOP|SPRINT|MOBILITY|BREATH|VACUUM|PLANK|HOLD|SIT-UP|SITUP|AB WHEEL|KNEE RAISE|LEG RAISE|DEAD BUG|DEADBUG/.test(exercise)){
    return 'NO_LOAD';
  }

  return currentBodyweight()?'BODYWEIGHT':'NO_LOAD';
}
function inputFields(type,mode){
  if(type==='TIME')return [{cls:'duration',ph:'MINUTES',step:'1'},{cls:'metric2',ph:'SPEED / LEVEL',step:'.1'}];
  if(type==='DISTANCE_LOAD')return [{cls:'distance',ph:'DISTANCE',step:'1'},{cls:'weight',ph:'LOAD',step:'2.5'}];
  if(type==='ROUNDS_TIME')return [{cls:'rounds',ph:'ROUNDS',step:'1'},{cls:'duration',ph:'MINUTES',step:'1'}];
  if(type==='BREATHS_TIME')return [{cls:'breaths',ph:'BREATHS',step:'1'},{cls:'duration',ph:'SECONDS',step:'1'}];
  if(mode==='NO_LOAD')return [{cls:'reps',ph:'REPS',step:'1'},{cls:'weight no-load',ph:'NO LOAD',step:'1',readonly:true,value:''}];
  if(mode==='BODYWEIGHT')return [{cls:'reps',ph:'REPS',step:'1'},{cls:'weight bodyweight-load',ph:'BODY WT',step:'.1',readonly:true,value:currentBodyweight()}];
  if(mode==='ADDED_LOAD')return [{cls:'reps',ph:'REPS',step:'1'},{cls:'weight',ph:'ADDED WT',step:'2.5',value:'0'}];
  return [{cls:'reps',ph:'REPS',step:'1'},{cls:'weight',ph:'WEIGHT',step:'2.5'}];
}
function prescribedReps(target,type){if(type!=='REPS_WEIGHT')return '';const text=String(target||'').trim();const match=text.match(/^\s*\d+\s*[x×]\s*(\d+(?:\.\d+)?)/i);return match?match[1]:''}
function setRow(n,type,target,mode){
  const f=inputFields(type,mode),auto=prescribedReps(target,type),autoClass=auto?' auto-prescribed':'',autoValue=auto?` value="${auto}"`:'';
  const secondValue=f[1].value!==undefined?` value="${f[1].value}"`:'';
  const secondReadonly=f[1].readonly?' readonly':'';
  const secondType=mode==='NO_LOAD'?'text':'number';

  return `<div class="set-grid" data-set="${n}">
    <div class="set-label">Set ${n}</div>
    <input class="${f[0].cls}${autoClass}" type="number" min="0" step="${f[0].step}"${autoValue} placeholder="${f[0].ph}" aria-label="${f[0].ph}">
    <input class="${f[1].cls}" type="${secondType}" min="0" step="${f[1].step}"${secondValue}${secondReadonly} placeholder="${f[1].ph}" aria-label="${f[1].ph}">
    <input class="rpe metric-rpe" type="number" min="1" max="10" step=".5" placeholder="RPE" aria-label="RPE">
    <input class="complete" type="checkbox" aria-label="Complete set">
  </div>`;
}
function setColumnHead(type,mode){const f=inputFields(type,mode);return `<div class="set-column-head"><span></span><span>${f[0].ph}</span><span>${f[1].ph}</span><span class="rpe-head">RPE</span><span>DONE</span></div>`}
function loadTrackingNote(mode){
  const bw=currentBodyweight();
  if(mode==='NO_LOAD')return '<span class="load-note">No external weight needed</span>';
  if(mode==='BODYWEIGHT')return `<span class="load-note">Bodyweight auto-filled${bw?`: ${bw} lb`:''}</span>`;
  if(mode==='ADDED_LOAD')return `<span class="load-note added-load">${bw?`Bodyweight ${bw} lb + `:''}enter added weight only</span>`;
  return '';
}
function copyFirstSet(btn){const ex=btn.closest('.exercise'),rows=[...ex.querySelectorAll('.set-grid')];if(rows.length<2)return;const first=rows[0];['reps','weight','distance','duration','rounds','breaths','metric2','rpe'].forEach(cls=>{const source=first.querySelector('.'+cls);if(!source)return;rows.slice(1).forEach(row=>{const target=row.querySelector('.'+cls);if(target)target.value=source.value})});scheduleDraftSave();setStatus('Set 1 copied to all sets.')}
function previousText(exercise){const p=appData.previous[String(exercise).toUpperCase()];if(!p||!p.sets.length)return 'No previous log';return `Last ${p.date}: `+p.sets.slice(0,4).map(s=>s.reps&&s.weight?`${s.reps}x${s.weight}`:s.distance?`${s.distance} distance`:s.durationSeconds?`${Math.round(Number(s.durationSeconds)/60)} min`:'set').join(', ')}
function renderWorkout(){const items=getDayRows(appData.program),groups={};items.forEach(x=>(groups[x.Block]??=[]).push(x));$('workout').innerHTML=Object.entries(groups).map(([block,rows])=>`<section class="card"><div class="block-title">${esc(block)}</div>${rows.map(x=>{const t=targetFor(x),type=inputType(x),mode=bodyweightMode(x),id='sets-'+slug(x.Exercise);return `<div class="exercise" data-block="${attr(block)}" data-slot="${attr(x.Slot)}" data-exercise="${attr(x.Exercise)}" data-target="${attr(t)}" data-type="${attr(type)}" data-bw-mode="${attr(mode)}" data-rest="${attr(x['Rest Seconds']||75)}"><div class="exercise-head"><div><h3>${esc(x.Slot)} — ${esc(x.Exercise)}</h3><div class="target">Target: ${esc(t)} • Suggested: ${esc(x['Suggested Load']||'—')}${x.Notes?' • '+esc(x.Notes):''}</div>${loadTrackingNote(mode)}<div class="previous">${esc(previousText(x.Exercise))}</div></div><button class="secondary" style="width:auto" onclick="toggleExercise(this)">Collapse</button></div><div class="exercise-body"><div class="exercise-actions"><button class="secondary" onclick="useLastPerformance('${js(x.Exercise)}',this)">Use Last</button><button class="secondary" onclick="copyFirstSet(this)">Copy Set 1</button><button class="secondary" onclick="showExerciseHistory('${js(x.Exercise)}')">History / PRs</button>${x['Video URL']?`<button class="secondary" onclick="window.open('${attr(x['Video URL'])}','_blank')">Video</button>`:''}</div>${setColumnHead(type,mode)}<div class="sets" id="${id}">${Array.from({length:setCount(t)},(_,j)=>setRow(j+1,type,t,mode)).join('')}</div><textarea class="notes" rows="2" placeholder="Exercise notes"></textarea><button class="secondary" style="margin-top:8px" onclick="addSet('${id}','${attr(type)}','${attr(mode)}')">+ Add Set</button></div></div>`}).join('')}</section>`).join('')||'<section class="card"><div class="section-title">No workout listed.</div></section>';bindWorkoutEvents();updateProgress();scheduleDraftSave()}
function bindWorkoutEvents(){
  document.querySelectorAll('.exercise input,.exercise textarea').forEach(el=>{
    if(el.dataset.bound)return;
    el.dataset.bound='1';

    el.addEventListener('input',()=>{
      if(el.classList.contains('auto-prescribed'))el.classList.remove('auto-prescribed');
      if(el.classList.contains('auto-carried'))el.classList.remove('auto-carried');
      updateProgress();
      scheduleDraftSave();
    });

    el.addEventListener('change',e=>{
      if(e.target.classList.contains('complete')){
        const row=e.target.closest('.set-grid');
        row.classList.toggle('done',e.target.checked);

        if(e.target.checked){
          autofillNextSet(row);

          if((!appData.preferences||appData.preferences.showStopwatch!==false)&&$('autoTimer').checked){
            const ex=e.target.closest('.exercise');
            const rest=Number(ex.dataset.rest||0);
            if(rest>0)startTimer(rest);
          }
        }
      }

      updateExerciseState(e.target.closest('.exercise'));
      updateProgress();
      scheduleDraftSave();
    });
  });
}

function autofillNextSet(currentRow){
  const nextRow=currentRow.nextElementSibling;
  if(!nextRow||!nextRow.classList.contains('set-grid'))return;

  ['reps','weight','distance','duration','rounds','breaths','metric2','rpe'].forEach(cls=>{
    const source=currentRow.querySelector('.'+cls);
    const target=nextRow.querySelector('.'+cls);

    if(!source||!target||source.value===''||target.value!=='')return;

    target.value=source.value;
    target.classList.add('auto-carried');
    target.classList.remove('auto-prescribed');
  });
}

function updateExerciseState(ex){if(!ex)return;const boxes=[...ex.querySelectorAll('.complete')];ex.classList.toggle('completed',boxes.length>0&&boxes.every(b=>b.checked))}
function updateProgress(){const boxes=[...document.querySelectorAll('#workout .complete')],done=boxes.filter(b=>b.checked).length,total=boxes.length;$('progressText').textContent=`${done} of ${total} sets complete`;$('progressBar').style.width=total?`${done/total*100}%`:'0%'}
function toggleExercise(btn){const ex=btn.closest('.exercise');ex.classList.toggle('collapsed');btn.textContent=ex.classList.contains('collapsed')?'Expand':'Collapse'}
function addSet(id,type,mode){const el=$(id),ex=el.closest('.exercise'),resolvedMode=mode||ex.dataset.bwMode||'NORMAL';el.insertAdjacentHTML('beforeend',setRow(el.querySelectorAll('.set-grid').length+1,type,ex.dataset.target,resolvedMode));bindWorkoutEvents();updateProgress()}
function addSetToAll(){document.querySelectorAll('.sets').forEach(el=>{const ex=el.closest('.exercise');el.insertAdjacentHTML('beforeend',setRow(el.querySelectorAll('.set-grid').length+1,ex.dataset.type,ex.dataset.target,ex.dataset.bwMode||'NORMAL'))});bindWorkoutEvents();updateProgress()}
function useLastPerformance(exercise,btn){const p=appData.previous[String(exercise).toUpperCase()];if(!p){setStatus('No previous performance found.');return}const ex=btn.closest('.exercise'),rows=[...ex.querySelectorAll('.set-grid')];p.sets.forEach((s,i)=>{if(!rows[i])addSet(ex.querySelector('.sets').id,ex.dataset.type);const row=ex.querySelectorAll('.set-grid')[i];setValue(row,'reps',s.reps);setValue(row,'weight',s.weight);setValue(row,'distance',s.distance);setValue(row,'duration',s.durationSeconds?Number(s.durationSeconds)/60:'');setValue(row,'rounds',s.rounds);setValue(row,'breaths',s.breaths);setValue(row,'rpe',s.rpe)});scheduleDraftSave();setStatus('Previous performance loaded.')}
function setValue(row,cls,value){const el=row.querySelector('.'+cls);if(el&&value!==''&&!el.readOnly)el.value=value}

function renderDashboard(){
  const d=appData.dashboard||{};
  const change=Number(d.weightChange||0);
  const changeClass=change<0?'positive':change>0?'negative':'';
  const changeText=d.weightChange===''?'No trend yet':`${change>0?'+':''}${change} lb from first check-in`;
  const series=d.bodyweightSeries||[];
  const sessions=d.recentSessions||[];
  const checkins=d.recentCheckIns||[];

  $('view-dashboard').innerHTML=`
    <div class="dashboard-grid">
      ${metricCard('Sessions This Week',d.sessionsThisWeek||0,'Training days completed')}
      ${metricCard('Set Completion',`${d.completionRateLast7||0}%`,`${d.completedSetsLast7||0} of ${d.totalSetsLast7||0} sets — last 7 days`)}
      ${metricCard('7-Day Volume',Number(d.volumeLast7||0).toLocaleString(),'Weight × reps')}
      ${metricCard('Latest Weight',d.latestWeight?`${d.latestWeight} lb`:'—',`<span class="${changeClass}" style="text-transform:none;letter-spacing:0">${changeText}</span>`)}
      ${metricCard('Average Sleep',d.averageSleep7?`${d.averageSleep7} hr`:'—','Last 7 days')}
      ${metricCard('Average Steps',d.averageSteps7?Number(d.averageSteps7).toLocaleString():'—','Last 7 days')}
      ${metricCard('Average Protein',d.averageProtein7?`${d.averageProtein7} g`:'—','Last 7 days')}
      ${metricCard('Energy / Soreness',`${d.averageEnergy7||'—'} / ${d.averageSoreness7||'—'}`,'1–5 averages')}
    </div>

    <section class="card">
      <div class="section-title">This Week</div>
      <div class="week-strip">${(d.weekStatus||[]).map(x=>`<div class="day-chip ${x.complete?'done':''}">${esc(x.day.slice(0,3))}<br>${x.complete?'✓':'—'}</div>`).join('')}</div>
    </section>

    <section class="card">
      <div class="section-title">Bodyweight Trend</div>
      <div class="chart-wrap">${bodyweightChart(series)}</div>
    </section>

    <section class="card">
      <div class="section-title">Daily Check-In</div>
      <div class="checkin-grid">
        ${checkInput('checkDate','Date','date',$('date').value)}
        ${checkInput('checkWeight','Bodyweight (lb)','number','', '0.1')}
        ${checkInput('checkWaist','Waist (in)','number','', '0.1')}
        ${checkInput('checkSleep','Sleep (hours)','number','', '0.1')}
        ${checkInput('checkSteps','Steps','number')}
        ${checkInput('checkCalories','Calories','number')}
        ${checkInput('checkProtein','Protein (g)','number')}
        ${checkInput('checkWater','Water','number','', '0.1')}
        ${checkSelect('checkEnergy','Energy (1–5)')}
        ${checkSelect('checkSoreness','Soreness (1–5)')}
        <div class="wide"><label>Notes</label><textarea id="checkNotes" rows="3" placeholder="Recovery, digestion, stress, soreness…"></textarea></div>
        <div class="wide"><button class="primary" onclick="saveCheckIn()">Save Check-In</button></div>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Recent Sessions</div>
      <div class="dashboard-list">${sessions.map(s=>`<div class="dashboard-list-row"><b>${esc(s.date)}</b><span>${esc(s.day)} • ${s.completedSets}/${s.totalSets} sets • ${formatSeconds(s.durationSeconds)}</span><b>${Number(s.volume||0).toLocaleString()}</b></div>`).join('')||'<div class="note-card">No sessions saved yet.</div>'}</div>
    </section>

    <section class="card">
      <div class="section-title">Recent Check-Ins</div>
      <div class="dashboard-list">${checkins.map(c=>`<div class="dashboard-list-row"><b>${esc(c.date)}</b><span>${c.bodyweight?esc(c.bodyweight)+' lb':''}${c.sleepHours?' • '+esc(c.sleepHours)+' hr sleep':''}${c.steps?' • '+Number(c.steps).toLocaleString()+' steps':''}</span><b>${c.energy?'E '+esc(c.energy):''}${c.soreness?' / S '+esc(c.soreness):''}</b></div>`).join('')||'<div class="note-card">No check-ins saved yet.</div>'}</div>
    </section>`;
}

function metricCard(label,value,detail){
  return `<div class="metric-card"><span>${label}</span><b>${value}</b><small>${detail||''}</small></div>`;
}

function checkInput(id,label,type,value,step){
  return `<div><label>${label}</label><input id="${id}" type="${type}" ${step?`step="${step}"`:''} value="${attr(value||'')}"></div>`;
}

function checkSelect(id,label){
  return `<div><label>${label}</label><select id="${id}"><option value="">—</option><option>1</option><option>2</option><option>3</option><option>4</option><option>5</option></select></div>`;
}

function bodyweightChart(series){
  if(!series||!series.length)return '<div class="chart-empty">Save bodyweight check-ins to build your trend line.</div>';
  const width=620,height=180,padX=36,padY=24;
  const values=series.map(x=>Number(x.weight)).filter(v=>isFinite(v));
  let min=Math.min(...values),max=Math.max(...values);
  if(min===max){min-=1;max+=1}
  const range=max-min;
  const points=series.map((x,i)=>{
    const px=series.length===1?width/2:padX+i*(width-padX*2)/(series.length-1);
    const py=height-padY-(Number(x.weight)-min)*(height-padY*2)/range;
    return {x:px,y:py,label:x.date,value:x.weight};
  });
  const poly=points.map(p=>`${p.x},${p.y}`).join(' ');
  const circles=points.map((p,i)=>`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#4338ca"><title>${esc(p.label)}: ${esc(p.value)} lb</title></circle>${(i===0||i===points.length-1)?`<text x="${p.x}" y="${p.y-9}" text-anchor="middle" font-size="11" fill="#374151">${esc(p.value)}</text>`:''}`).join('');
  const labels=points.filter((_,i)=>i===0||i===points.length-1||i===Math.floor(points.length/2)).map(p=>`<text x="${p.x}" y="${height-5}" text-anchor="middle" font-size="10" fill="#6b7280">${esc(p.label)}</text>`).join('');
  return `<svg class="mini-chart" viewBox="0 0 ${width} ${height}" role="img" aria-label="Bodyweight trend"><line x1="${padX}" y1="${padY}" x2="${padX}" y2="${height-padY}" stroke="#d1d5db"/><line x1="${padX}" y1="${height-padY}" x2="${width-padX}" y2="${height-padY}" stroke="#d1d5db"/><polyline points="${poly}" fill="none" stroke="#4338ca" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>${circles}${labels}</svg>`;
}

function saveCheckIn(){
  setStatus('Saving check-in…');
  const payload={
    date:$('checkDate').value,
    bodyweight:$('checkWeight').value,
    waist:$('checkWaist').value,
    sleepHours:$('checkSleep').value,
    steps:$('checkSteps').value,
    calories:$('checkCalories').value,
    protein:$('checkProtein').value,
    water:$('checkWater').value,
    energy:$('checkEnergy').value,
    soreness:$('checkSoreness').value,
    notes:$('checkNotes').value
  };
  google.script.run.withSuccessHandler(dashboard=>{
    appData.dashboard=dashboard;
    renderDashboard();
    setStatus('Check-in saved.');
  }).withFailureHandler(showError).saveCheckIn(authToken,payload);
}


function renderWarmup(){const rows=getDayRows(appData.warmups);$('view-warmup').innerHTML=`<section class="card"><div class="section-title">${esc($('day').value)} Warm-up</div>${rows.map(x=>`<div class="simple-row"><strong>${esc(x.Dose)}</strong><div><b>${esc(x.Drill)}</b><br><span class="target">${esc(x.Purpose||'')}</span></div><input type="checkbox" class="complete"></div>`).join('')||'<div class="simple-row">No warm-up listed.</div>'}</section>`}
function renderDaily(){const meals=getDayRows(appData.meals),targets=getDayRows(appData.dailyTargets),sauna=getDayRows(appData.sauna);$('view-daily').innerHTML=`<section class="card"><div class="section-title">Meals</div>${meals.map(x=>`<div class="simple-row"><strong>${esc(x.Time)}</strong><div><b>${esc(x.Meal)}</b><br><span class="target">${esc(x.Food)}</span></div><input type="checkbox" class="complete"></div>`).join('')}</section><section class="card"><div class="section-title">Daily Targets</div>${targets.map(x=>`<div class="simple-row"><strong>${esc(x.Item)}</strong><div>${esc(x.Target)}</div><input type="checkbox" class="complete"></div>`).join('')}</section><section class="card"><div class="section-title">Sauna / Recovery</div>${sauna.map(x=>`<div class="simple-row"><strong>${esc(x.Item)}</strong><div>${esc(x.Detail)}</div><span></span></div>`).join('')}</section>`}
function renderNotes(){const rows=(appData.upgradeNotes||[]).filter(x=>x.Day===$('day').value);$('view-notes').innerHTML=`<section class="card"><div class="section-title">${esc($('day').value)} Coach Notes</div>${rows.map(x=>`<div class="note-card">${esc(x.Note)}</div>`).join('')||'<div class="note-card">No coach note listed.</div>'}</section>`}
function renderHistory(rows){
  const list=rows||[];
  $('history').innerHTML=list.map(r=>`<tr><td>${esc(r.Date||'')}</td><td>${esc(r.Day||'')}</td><td><button class="secondary" style="padding:5px" onclick="showExerciseHistory('${js(r.Exercise||'')}')">${esc(r.Exercise||'')}</button></td><td>${esc(r.Set||'')}</td><td>${esc(r.Reps||'')}</td><td>${esc(r.Weight||'')}</td><td>${esc(r.RPE||'')}</td></tr>`).join('')||'<tr><td colspan="7">No workouts saved yet.</td></tr>';
  const cards=$('historyCards');
  if(cards){
    cards.innerHTML=list.map(r=>`<div class="history-card" onclick="showExerciseHistory('${js(r.Exercise||'')}')"><div><div class="history-card-title">${esc(r.Exercise||'')}</div><div class="history-card-meta">${esc(r.Date||'')} • ${esc(r.Day||'')} • Set ${esc(r.Set||'')}${r.RPE?' • RPE '+esc(r.RPE):''}</div></div><div class="history-card-load">${r.Reps?esc(r.Reps)+' reps':''}${r.Reps&&r.Weight?'<br>':''}${r.Weight?esc(r.Weight)+' lb':''}</div></div>`).join('')||'<div class="note-card">No workouts saved yet.</div>';
  }
}
function renderAdmin(){
  if(!appData||String(appData.role).toLowerCase()!=='coach')return;

  const showStopwatch=!appData.preferences||appData.preferences.showStopwatch!==false;

  $('view-admin').innerHTML=`
    <section class="card">
      <div class="section-title">Coach Preferences</div>
      <div class="preference-row">
        <div class="preference-copy">
          <b>Show Floating Stopwatch</b>
          <span>Turn this off to remove the floating rest stopwatch and automatic rest countdown for everyone using the app.</span>
        </div>
        <label class="switch">
          <input id="showStopwatchPreference" type="checkbox" ${showStopwatch?'checked':''} onchange="saveStopwatchPreference(this.checked)">
          <span class="switch-slider"></span>
        </label>
      </div>
    </section>

    <section class="card">
      <div class="section-title">Program Editing</div>
      <div class="note-card">Edit exercises, weeks, input type, rest time and video links directly in the Google Sheet. Changes load automatically when the app opens.<br><br><a class="link-button" href="${attr(appData.spreadsheetUrl)}" target="_blank">Open Program Spreadsheet</a></div>
    </section>

    <section class="card">
      <div class="section-title">Add / Update Athlete</div>
      <div class="admin-grid">
        <input id="newAthlete" placeholder="Athlete name">
        <input id="newPin" inputmode="numeric" placeholder="PIN">
        <select id="newRole"><option>Athlete</option><option>Coach</option></select>
        <button class="primary" onclick="saveProfile()">Save</button>
      </div>
      <div id="profileList">${profileRows(appData.profiles)}</div>
    </section>`;
}

function applyCoachPreferences(){
  if(!appData)return;

  const showStopwatch=!appData.preferences||appData.preferences.showStopwatch!==false;
  const timer=$('timer');

  if(timer)timer.classList.toggle('hidden',!showStopwatch);

  if(!showStopwatch){
    stopTimer();
    timerRemaining=0;
    drawTimer();
    const autoTimer=$('autoTimer');
    if(autoTimer)autoTimer.checked=false;
  }
}

function saveStopwatchPreference(show){
  setStatus('Saving coach preference…');

  google.script.run
    .withSuccessHandler(preferences=>{
      appData.preferences=preferences;
      applyCoachPreferences();
      renderAdmin();
      setStatus(show?'Stopwatch enabled.':'Stopwatch removed.');
    })
    .withFailureHandler(error=>{
      const control=$('showStopwatchPreference');
      if(control)control.checked=!show;
      showError(error);
    })
    .setCoachPreference(authToken,'showStopwatch',show);
}

function profileRows(rows){return (rows||[]).map(p=>`<div class="profile-row"><b>${esc(p.Athlete)}</b><span>${esc(p.Role)}</span><span>${String(p.Active).toUpperCase()==='TRUE'?'Active':'Inactive'}</span><button class="${String(p.Active).toUpperCase()==='TRUE'?'danger':'secondary'}" onclick="toggleProfile('${js(p.Athlete)}',${String(p.Active).toUpperCase()!=='TRUE'})">${String(p.Active).toUpperCase()==='TRUE'?'Disable':'Enable'}</button></div>`).join('')}
function saveProfile(){google.script.run.withSuccessHandler(rows=>{appData.profiles=rows;renderAdmin();setStatus('Profile saved.')}).withFailureHandler(showError).addOrUpdateProfile(authToken,$('newAthlete').value,$('newPin').value,$('newRole').value)}
function toggleProfile(name,active){google.script.run.withSuccessHandler(rows=>{appData.profiles=rows;renderAdmin()}).withFailureHandler(showError).setProfileActive(authToken,name,active)}
function showView(name){
  document.body.dataset.view=name;
  ['workout','dashboard','warmup','daily','notes','history','admin'].forEach(v=>$('view-'+v).classList.toggle('hidden',v!==name));
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.view===name));
  if(window.matchMedia('(max-width:700px)').matches){
    window.scrollTo({top:0,behavior:'smooth'});
  }
}
function collect(){const out=[];document.querySelectorAll('.exercise').forEach(ex=>{const notes=ex.querySelector('.notes').value,type=ex.dataset.type;ex.querySelectorAll('.set-grid').forEach((s,i)=>{const durationInput=s.querySelector('.duration');let duration=durationInput?Number(durationInput.value||0):0;if(type==='TIME'||type==='ROUNDS_TIME')duration*=60;out.push({block:ex.dataset.block,slot:ex.dataset.slot,exercise:ex.dataset.exercise,target:ex.dataset.target,metricType:type,set:i+1,reps:value(s,'reps'),weight:value(s,'weight'),distance:value(s,'distance'),durationSeconds:duration||'',rounds:value(s,'rounds'),breaths:value(s,'breaths'),rpe:value(s,'rpe'),completed:s.querySelector('.complete').checked,notes})})});return out}
function value(row,cls){const el=row.querySelector('.'+cls);return el?el.value:''}
function saveWorkout(){setStatus('Saving…');const entries=collect();google.script.run.withSuccessHandler(summary=>{clearDraft();showSummary(summary);setStatus(`Saved ${summary.rowsSaved} sets.`);google.script.run.withSuccessHandler(rows=>{appData.history=rows;renderHistory(rows)}).getRecentHistory(authToken,40);google.script.run.withSuccessHandler(data=>{appData=data;renderWorkout();renderDashboard()}).getBootstrap(authToken)}).withFailureHandler(showError).saveWorkout(authToken,{sessionId,date:$('date').value,day:$('day').value,week:Number($('week').value),durationSeconds:Math.round((Date.now()-sessionStartedAt)/1000),entries})}
function resetSession(){if(!confirm('Clear all current entries?'))return;clearDraft();startNewDaySession();renderWorkout();setStatus('Session reset.')}
function scheduleDraftSave(){clearTimeout(draftTimer);draftTimer=setTimeout(saveDraft,300)}
function saveDraft(){if(!appData)return;localStorage.setItem(sessionKey('draft'),JSON.stringify({entries:collect(),savedAt:Date.now()}))}
function restoreDraft(){const raw=localStorage.getItem(sessionKey('draft'));if(!raw)return;try{const draft=JSON.parse(raw);const exercises=[...document.querySelectorAll('.exercise')];draft.entries.forEach(e=>{const ex=exercises.find(x=>x.dataset.exercise===e.exercise);if(!ex)return;while(ex.querySelectorAll('.set-grid').length<e.set)addSet(ex.querySelector('.sets').id,ex.dataset.type);const row=ex.querySelectorAll('.set-grid')[e.set-1];['reps','weight','distance','rounds','breaths','rpe'].forEach(k=>setValue(row,k,e[k]));const dur=row.querySelector('.duration');if(dur&&e.durationSeconds)dur.value=(ex.dataset.type==='BREATHS_TIME'?e.durationSeconds:e.durationSeconds/60);row.querySelector('.complete').checked=Boolean(e.completed);row.classList.toggle('done',Boolean(e.completed));ex.querySelector('.notes').value=e.notes||''});exercises.forEach(updateExerciseState);updateProgress();setStatus('Unfinished session restored.')}catch(err){console.log(err)}}
function clearDraft(){localStorage.removeItem(sessionKey('draft'))}
function sessionKey(kind){return `jmac:${appData?appData.athlete:'login'}:${$('day')?$('day').value:'day'}:${$('week')?$('week').value:'1'}:${$('date')?$('date').value:'date'}:${kind}`}
function showExerciseHistory(exercise){openModal('<h2>Loading '+esc(exercise)+'…</h2>');google.script.run.withSuccessHandler(data=>{const p=data.pr;openModal(`<h2>${esc(data.exercise)} History</h2><div class="pr-grid"><div class="pr">Max Weight<b>${esc(p.maxWeight||'—')}</b></div><div class="pr">Max Reps<b>${esc(p.maxReps||'—')}</b></div><div class="pr">Est. 1RM<b>${esc(p.estimated1RM||'—')}</b></div><div class="pr">Best Set Volume<b>${esc(p.bestVolume||'—')}</b></div></div><div style="overflow:auto;margin-top:12px"><table><thead><tr><th>Date</th><th>Set</th><th>Reps</th><th>Weight</th><th>RPE</th></tr></thead><tbody>${data.rows.map(r=>`<tr><td>${esc(r.Date)}</td><td>${esc(r.Set)}</td><td>${esc(r.Reps)}</td><td>${esc(r.Weight)}</td><td>${esc(r.RPE)}</td></tr>`).join('')}</tbody></table></div>`) }).withFailureHandler(showError).getExerciseHistory(authToken,exercise,40)}
function showSummary(s){openModal(`<h2>Workout Saved</h2><div class="summary-good"><b>${s.completedSets} of ${s.totalSets} sets completed</b><br>Training volume: ${Number(s.volume).toLocaleString()}<br>Duration: ${formatSeconds(s.durationSeconds)}</div>${s.personalRecords&&s.personalRecords.length?`<h3>Personal Records</h3><ul>${s.personalRecords.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:''}`)}
function openModal(content){$('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal">${content}<button class="primary" style="margin-top:12px" onclick="closeModal()">Close</button></div></div>`}
function closeModal(){$('modalRoot').innerHTML=''}
function startTimer(seconds){stopTimer();timerRemaining=Number(seconds||$('timerPreset').value);$('timerPreset').value=[60,75,90,120,180].includes(timerRemaining)?String(timerRemaining):$('timerPreset').value;drawTimer();timerInterval=setInterval(()=>{timerRemaining--;drawTimer();if(timerRemaining<=0){stopTimer();timerRemaining=0;drawTimer();if(navigator.vibrate)navigator.vibrate([200,100,200]);setStatus('Rest complete.')}} ,1000)}
function stopTimer(){if(timerInterval)clearInterval(timerInterval);timerInterval=null}
function drawTimer(){$('timerDisplay').textContent=formatSeconds(timerRemaining)}
function formatSeconds(sec){sec=Math.max(0,Number(sec||0));const m=Math.floor(sec/60),s=Math.floor(sec%60);return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}

function initMobileLayout(){
  const toolbar=document.querySelector('.toolbar');
  const toggle=$('mobileOptionsToggle');
  const small=window.matchMedia('(max-width:700px)').matches;
  if(toolbar&&small){
    toolbar.classList.add('mobile-collapsed');
    if(toggle)toggle.textContent='Show Workout Options';
  }
  updateVisualViewport();
  if(window.visualViewport){
    window.visualViewport.addEventListener('resize',updateVisualViewport);
    window.visualViewport.addEventListener('scroll',updateVisualViewport);
  }
  window.addEventListener('orientationchange',()=>setTimeout(updateVisualViewport,150));
}

function toggleMobileOptions(){
  const toolbar=document.querySelector('.toolbar');
  const toggle=$('mobileOptionsToggle');
  if(!toolbar)return;
  const collapsed=toolbar.classList.toggle('mobile-collapsed');
  if(toggle)toggle.textContent=collapsed?'Show Workout Options':'Hide Workout Options';
}

function toggleTimerPanel(){
  const timer=$('timer');
  const button=$('timerToggle');
  if(!timer)return;
  const collapsed=timer.classList.toggle('collapsed');
  if(button){
    button.textContent=collapsed?'+':'−';
    button.setAttribute('aria-label',collapsed?'Expand rest timer':'Minimize rest timer');
  }
}

function updateVisualViewport(){
  const vv=window.visualViewport;
  if(!vv)return;
  const keyboard=Math.max(0,window.innerHeight-vv.height-vv.offsetTop);
  document.documentElement.style.setProperty('--keyboard-offset',keyboard+'px');
  document.body.classList.toggle('keyboard-open',keyboard>120);
}

async function shareApp(){const data={title:$('appTitle').textContent||'JMAC Training',text:'Open the JMAC training app:',url:window.location.href};try{if(navigator.share){await navigator.share(data);return}await navigator.clipboard.writeText(window.location.href);setStatus('Link copied.')}catch(e){if(e.name!=='AbortError')setStatus('Copy this link: '+window.location.href)}}
function setStatus(msg){$('status').textContent=msg}
function showError(e){setStatus('Error: '+(e.message||e));if(String(e.message||e).includes('session expired'))logoutUser()}
function newId(){return crypto.randomUUID?crypto.randomUUID():String(Date.now())+'-'+Math.random()}
function slug(v){return String(v).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+Math.random().toString(36).slice(2,6)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function attr(v){return esc(v).replace(/`/g,'&#096;')}
function js(v){return String(v??'').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,' ')}
</script>

<div id="installModal" class="modal-backdrop hidden" onclick="closeInstallModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <h2>Install JMAC Training</h2>
    <div id="installPlatform" class="platform-pill">Mobile</div>
    <div id="installInstructions"></div>
    <div style="display:flex;gap:8px;margin-top:14px">
      <button class="secondary" onclick="closeInstallModal()">Close</button>
      <button class="primary" onclick="shareApp()">Text / Share Link</button>
    </div>
  </div>
</div>
